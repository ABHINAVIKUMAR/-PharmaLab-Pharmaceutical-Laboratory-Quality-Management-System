services:
  db:
    image: postgres:16-alpine
    container_name: pharmalab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pharmalab
      POSTGRES_PASSWORD: pharmalab
      POSTGRES_DB: pharmalab
    ports:
      - "5432:5432"
    volumes:
      - pharmalab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmalab -d pharmalab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pharmalab_pgdata:
